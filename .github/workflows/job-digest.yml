name: Job Digest

# Runs on GitHub's servers — no machine of your own needs to be switched on.
#
# GitHub cron is ALWAYS UTC and ignores the timezone in config.yaml.
# Kenya is UTC+3 all year (no daylight saving), so subtract 3 hours:
#   07:00 EAT -> 04:00 UTC
#   21:25 EAT -> 18:25 UTC
on:
  schedule:
    - cron: "0 4 * * *"      # 07:00 Africa/Nairobi
    - cron: "25 18 * * *"    # 21:25 Africa/Nairobi
  workflow_dispatch:          # also lets you trigger a run by hand from the Actions tab

# Two runs must never overwrite each other's committed de-duplication database.
concurrency:
  group: job-digest
  cancel-in-progress: false

permissions:
  contents: write             # needed to commit the updated seen.db and digest.html

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the job search and deliver the digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python run.py -v

      - name: Persist what was already sent
        # The runner is wiped after every job, so the de-duplication database
        # is committed back to the repo. Without this you would be sent the
        # same vacancies twice a day, forever.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/seen.db digest.html
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Job digest $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Upload the digest as a downloadable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_number }}
          path: |
            digest.html
            logs/jobseeker.log
          retention-days: 14
